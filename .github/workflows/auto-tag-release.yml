name: Reusable Tag and Release

on:
  workflow_call:
    inputs:
      tag-prefix:
        required: false
        type: string
        default: ""
jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Extract Short Commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Create Tag
        id: tag
#        uses: anothrNick/github-tag-action@1.73.0
        uses: TheYorkshireDev/github-tag-action@bugfix/support-forward-slash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#          DRY_RUN: true
          TAG_PREFIX: "${{ inputs.tag-prefix }}"
          PRERELEASE_SUFFIX: "beta.${{ steps.sha.outputs.short_sha }}"
          PRERELEASE: true
#          RELEASE_BRANCHES: main
